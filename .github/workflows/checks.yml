name: Checks

on:
  # `labeled` is here so adding the `companion-apk` label re-runs checks and
  # picks up the companion upload — a plain re-run replays the original event
  # payload, which would not carry the new label.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew :app:lintDebug :mobile:lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble companion debug APK
        run: ./gradlew :mobile:assembleDebug --no-daemon

      - name: Upload debug APK
        id: upload_apk
        uses: actions/upload-artifact@v6
        with:
          name: watchface-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # The companion APK is ~12.4 MiB a run and dominated the account-wide
      # Actions storage quota. Ordinary runs still assemble it (so a broken
      # :mobile build fails CI) but only publish it on request.
      - name: Upload companion debug APK
        id: upload_mobile_apk
        if: >-
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.pull_request.labels.*.name, 'companion-apk')
        uses: actions/upload-artifact@v6
        with:
          name: companion-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Add APK link to job summary
        env:
          COMPANION_URL: ${{ steps.upload_mobile_apk.outputs.artifact-url }}
        run: |
          {
            echo "### 🚀 Build Successful!"
            echo ""
            echo "Watch face APK: [\`watchface-debug-apk.zip\`](${{ steps.upload_apk.outputs.artifact-url }}) (GitHub login required, expires in 7 days)"
            echo ""
            if [ -n "$COMPANION_URL" ]; then
              echo "Companion APK: [\`companion-debug-apk.zip\`]($COMPANION_URL)"
            else
              echo "Companion APK: built, not uploaded. Add the \`companion-apk\` label to this PR (or re-run via **Run workflow**) to publish it."
            fi
            echo ""
            echo "Run page: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: watchface-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            mobile/build/reports/lint-results-debug.html
            mobile/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  validate-wff:
    name: WFF XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run WFF validator
        run: |
          set +e
          java -jar app/libs/wff-validator.jar 4 app/src/main/res/raw/watchface.xml 2>&1 | tee wff.log
          exit_code=${PIPESTATUS[0]}
          set -e
          msg=$(grep -E "PASSED|FAILED" wff.log | tail -1 | sed -E 's/^[A-Z]+: //')
          {
            echo "### WFF XML Validation"
            echo ""
            echo "${msg:-No result line found in validator output.}"
          } >> "$GITHUB_STEP_SUMMARY"
          # The validator exits 0 even when validation fails — derive status from the log.
          if grep -qE "^[A-Z]+:.*FAILED" wff.log; then
            exit 1
          fi
          exit "$exit_code"

  memory-footprint:
    name: Memory footprint evaluation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download APK from build job
        uses: actions/download-artifact@v7
        with:
          name: watchface-debug-apk
          path: apk

      - name: Evaluate memory footprint
        run: |
          apk=$(ls apk/*.apk | head -1)
          set +e
          java -jar app/libs/memory-footprint.jar \
            --schema-version 4 \
            --watch-face "$apk" 2>&1 | tee mem.log
          exit_code=${PIPESTATUS[0]}
          set -e
          msg=$(grep "\[MEMORY_FOOTPRINT\]:" mem.log | tail -1 | sed -E 's/^.*\[MEMORY_FOOTPRINT\]: *//')
          {
            echo "### Memory footprint evaluation"
            echo ""
            echo "${msg:-No \[MEMORY_FOOTPRINT\] line found in evaluator output.}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
