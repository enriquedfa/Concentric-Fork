[versions]
agp = "9.3.0"
# Everything below powers the :mobile companion app only — the :app watch face
# module is pure WFF XML and pulls in none of it.
kotlin = "2.4.10"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
wearRemoteInteractions = "1.2.0"
playServicesWearable = "20.0.1"
coroutinesPlayServices = "1.11.0"
# Material 3 Expressive lives in this alpha of material3 (the stable BOM pins an
# older baseline). Bump together with a newer BOM when Expressive stabilises.
composeMaterial3Expressive = "1.5.0-alpha24"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3Expressive" }
androidx-wear-remote-interactions = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearRemoteInteractions" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
